name: Java CI Quality Guard

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # 1. THE BUILDER: Compiles code and runs Unit Tests + Jacoco
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw -B clean verify
        env:
          API_EXCHANGERATE_KEY: ${{ secrets.API_EXCHANGERATE_KEY }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: target/

  # 2. THE LIBRARIAN: Checks code formatting (Checkstyle)
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

  # 3. THE CRITIC: Analyzes code quality (SonarCloud)
  sonar_analysis:
    runs-on: ubuntu-latest
    needs: build_and_test # Runs only after a successful build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Sonar history

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: target/

      - name: Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 4. THE SECURITY GUARD: Scans for vulnerable libraries (Snyk)
  security_scan:
    runs-on: ubuntu-latest
    needs: build_and_test 
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      # We add -DskipTests=false to ensure it actually runs your JUnit tests!
      run: ./mvnw -B clean verify
