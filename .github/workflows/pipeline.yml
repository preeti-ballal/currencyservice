name: Java CI Quality Guard

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # 1. THE BUILDER: Compiles code and runs Unit Tests + Jacoco
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw -B clean verify
        env:
          # Your API key is needed for tests to pass
          API_EXCHANGERATE_KEY: ${{ secrets.API_EXCHANGERATE_KEY }}

  # 2. THE LIBRARIAN: Checks code formatting (Checkstyle)
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

  # 3. THE CRITIC: Analyzes code quality (SonarCloud)
  sonar_analysis:
    runs-on: ubuntu-latest
    needs: build_and_test # Runs only after a successful build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Sonar history

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=preeti-ballal_currencyservice
            -Dsonar.organization=preeti-workspace

  # 4. THE SECURITY GUARD: Scans for vulnerable libraries (Snyk)
  security_scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      # We add -DskipTests=false to ensure it actually runs your JUnit tests!
      run: ./mvnw -B clean verify
